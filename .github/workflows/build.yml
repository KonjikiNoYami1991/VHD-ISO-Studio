name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]   # release pubblicata dal sito: la CI compila e allega i file
  workflow_dispatch:

permissions:
  contents: write   # necessario solo per pubblicare la release sui tag v*

jobs:
  verify:
    name: Verifica statica (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test unitari
        run: dotnet test tests/VhdIsoStudio.Tests/VhdIsoStudio.Tests.csproj -c Release
      - name: Stringhe + XAML + compilazione C#
        run: bash tools/verify.sh

  build:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: verify
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (exe singolo + pacchetto portabile)
        shell: pwsh
        run: |
          $ver = ([regex]::Match((Get-Content src/VhdIsoStudio/VhdIsoStudio.csproj -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value
          # 1) exe singolo (le librerie native WPF vengono estratte in %TEMP% all'avvio)
          dotnet publish src/VhdIsoStudio/VhdIsoStudio.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o out-single
          $exe = "VhdIsoStudio_${ver}_${{ matrix.rid }}.exe"
          Copy-Item out-single/VhdIsoStudio.exe $exe
          # 2) cartella portabile (librerie native accanto all'exe: nessuna scrittura fuori dalla cartella)
          $pkg = "pkg/VhdIsoStudio"
          dotnet publish src/VhdIsoStudio/VhdIsoStudio.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PortableBuild=true -o $pkg
          Get-ChildItem $pkg -Filter *.pdb | Remove-Item
          Copy-Item docs/LEGGIMI-PORTABLE.txt $pkg/
          Copy-Item LICENSE $pkg/LICENSE.txt
          New-Item -ItemType Directory -Force "$pkg/tools/oscdimg" | Out-Null
          "oscdimg.exe, etfsboot.com, efisys.bin, efisys_noprompt.bin: downloaded here by the app on first use (Microsoft Windows ADK component, not redistributed)." | Set-Content "$pkg/tools/oscdimg/README.txt" -Encoding utf8
          $zip = "VhdIsoStudio_${ver}_${{ matrix.rid }}_portable.zip"
          Compress-Archive -Path "pkg/VhdIsoStudio" -DestinationPath $zip
          foreach ($f in @($exe, $zip)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$f" | Set-Content "$f.sha256" -Encoding ascii
          }
          Get-ChildItem $pkg | Format-Table Name, Length
          "VER=$ver" | Out-File $env:GITHUB_ENV -Append
          "EXE_NAME=$exe" | Out-File $env:GITHUB_ENV -Append
          "ZIP_NAME=$zip" | Out-File $env:GITHUB_ENV -Append
      - name: Selftest (exe singolo + portabile)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # i runner GitHub sono elevati: l'exe requireAdministrator parte senza prompt UAC
          $p = Start-Process -FilePath ".\$env:EXE_NAME" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest exe singolo fallito: codice $($p.ExitCode)" }
          # portabile: estrae lo ZIP in una cartella pulita e verifica che i dati finiscano in Data\
          Expand-Archive $env:ZIP_NAME -DestinationPath st
          $p = Start-Process -FilePath "st\VhdIsoStudio\VhdIsoStudio.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest portabile fallito: codice $($p.ExitCode)" }
          if (-not (Get-ChildItem "st\VhdIsoStudio\Data\Logs" -Filter *.log -ErrorAction SilentlyContinue)) { throw "Modalita' portabile: log non creato in Data\Logs" }
          Write-Host "Selftest OK (single + portable, log in Data\Logs)"
      - name: Screenshot per la documentazione
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $shots = Join-Path $pwd 'screenshots'
          $p = Start-Process -FilePath "st\VhdIsoStudio\VhdIsoStudio.exe" -ArgumentList '--screenshots', "`"$shots`"" -Wait -PassThru
          Get-ChildItem $shots -ErrorAction SilentlyContinue | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { Get-Content st\VhdIsoStudio\Data\Logs\*.log -Tail 40; throw "Screenshot falliti: codice $($p.ExitCode)" }
      - name: Aggiorna gli screenshot nel repo (solo push su master)
        if: matrix.rid == 'win-x64' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots/*.png)) { Write-Host "Nessuno screenshot"; exit 0 }
          New-Item -ItemType Directory -Force docs/images/screenshots | Out-Null
          Copy-Item screenshots/*.png docs/images/screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Screenshot invariati"; exit 0 }
          git commit -m "docs: update screenshots [skip ci]"
          git fetch --depth=20 origin master
          git rebase origin/master
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: VhdIsoStudio-${{ matrix.rid }}
          path: |
            ${{ env.EXE_NAME }}
            ${{ env.EXE_NAME }}.sha256
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VHD ISO Studio ${{ env.VER }}
          body_path: docs/RELEASE-NOTES-${{ env.VER }}.md
          files: |
            ${{ env.EXE_NAME }}
            ${{ env.EXE_NAME }}.sha256
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
