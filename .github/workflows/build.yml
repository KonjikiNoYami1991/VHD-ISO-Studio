name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # necessario solo per pubblicare la release sui tag v*

jobs:
  verify:
    name: Verifica statica (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test unitari
        run: dotnet test tests/VhdIsoStudio.Tests/VhdIsoStudio.Tests.csproj -c Release
      - name: Stringhe + XAML + compilazione C#
        run: bash tools/verify.sh

  build:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: verify
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/VhdIsoStudio/VhdIsoStudio.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o out
          $ver = ([regex]::Match((Get-Content src/VhdIsoStudio/VhdIsoStudio.csproj -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value
          $name = "VhdIsoStudio_${ver}_${{ matrix.rid }}.exe"
          Copy-Item out/VhdIsoStudio.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$name" | Set-Content "$name.sha256" -Encoding ascii
          "EXE_NAME=$name" | Out-File $env:GITHUB_ENV -Append
      - name: Selftest
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # i runner GitHub sono elevati: l'exe requireAdministrator parte senza prompt UAC
          $p = Start-Process -FilePath ".\$env:EXE_NAME" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest fallito: codice $($p.ExitCode)" }
          Write-Host "Selftest OK"
      - uses: actions/upload-artifact@v4
        with:
          name: VhdIsoStudio-${{ matrix.rid }}
          path: |
            ${{ env.EXE_NAME }}
            ${{ env.EXE_NAME }}.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.EXE_NAME }}
            ${{ env.EXE_NAME }}.sha256
